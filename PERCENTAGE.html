<!DOCTYPE html>
<html lang="zh-MY">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三年级数学：百格图百分比挑战赛</title>
    <style>
        :root {
            --primary-color: #FFB7C5; 
            --secondary-color: #98DDCA; 
            --accent-color: #FFD3B6; 
            --text-color: #5D5D5D;
            --bg-color: #FDFBF0;
        }

        body {
            font-family: 'Segoe UI', "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-color);
        }

        h1 {
            color: #FF8B94;
            text-shadow: 2px 2px 0px #fff;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .main-container {
            display: flex;
            width: 100%;
            max-width: 1100px;
            gap: 30px;
            justify-content: center;
        }

        /* 游戏区域 */
        .game-section {
            flex: 1;
            background: white;
            border-radius: 40px;
            padding: 25px;
            box-shadow: 0 12px 0px #E0E0E0;
            border: 8px solid var(--accent-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 500px;
        }

        .group-a { border-color: #A8E6CF; }
        .group-b { border-color: #FFD3B6; }

        .header-info {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 20px;
            padding: 0 10px;
        }

        /* 百格图 */
        .grid-100 {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            width: 240px;
            height: 240px;
            border: 4px solid #5D5D5D;
            background-color: #fff;
            margin: 15px 0;
        }

        .cell {
            border: 0.5px solid #EEE;
        }

        .group-a .filled { background-color: #A8E6CF; border: 0.5px solid #8bd3b8; }
        .group-b .filled { background-color: #FFB7C5; border: 0.5px solid #f2a2b1; }

        /* 选项按钮 */
        .options-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            margin-top: 20px;
        }

        .option-btn {
            background: #F8F9FA;
            border: 3px solid #E9ECEF;
            padding: 12px;
            border-radius: 20px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover {
            transform: scale(1.05);
            background: #FFF;
            border-color: #FFD3B6;
        }

        /* 结果展示 */
        .result-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .final-stats {
            background: #F0F4F8;
            padding: 20px;
            border-radius: 30px;
            margin: 20px 0;
            width: 80%;
        }

        .stat-line { font-size: 22px; margin: 10px 0; font-weight: bold; }
        .score-num { color: #FF8B94; font-size: 40px; }
        .time-num { color: #6EB5FF; font-size: 30px; }

        .btn-restart {
            background: #5D5D5D;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>🖍️ 胖嘟嘟百格图挑战赛 🖍️</h1>

    <div class="main-container">
        <div id="game-a" class="game-section group-a">
            <div class="header-info">
                <span>🍀 A组</span>
                <span id="score-text-a">得分: 0</span>
            </div>
            <div id="content-a">
                <div class="grid-100" id="grid-a"></div>
                <div class="options-container" id="options-a"></div>
                <p style="margin-top:20px">第 <span id="progress-a">1</span> / 10 题</p>
            </div>
            <div id="result-a" class="result-screen">
                <h2>🏆 挑战结束!</h2>
                <div class="final-stats">
                    <div class="stat-line">最终得分: <span class="score-num" id="final-score-a">0</span></div>
                    <div class="stat-line">答题用时: <span class="time-num" id="final-time-a">0</span> 秒</div>
                </div>
                <button class="btn-restart" onclick="startGame('a')">重新挑战</button>
            </div>
        </div>

        <div id="game-b" class="game-section group-b">
            <div class="header-info">
                <span>🌸 B组</span>
                <span id="score-text-b">得分: 0</span>
            </div>
            <div id="content-b">
                <div class="grid-100" id="grid-b"></div>
                <div class="options-container" id="options-b"></div>
                <p style="margin-top:20px">第 <span id="progress-b">1</span> / 10 题</p>
            </div>
            <div id="result-b" class="result-screen">
                <h2>🌈 太棒了!</h2>
                <div class="final-stats">
                    <div class="stat-line">最终得分: <span class="score-num" id="final-score-b">0</span></div>
                    <div class="stat-line">答题用时: <span class="time-num" id="final-time-b">0</span> 秒</div>
                </div>
                <button class="btn-restart" onclick="startGame('b')">重新挑战</button>
            </div>
        </div>
    </div>

    <script>
        // 存储两组的独立状态
        const gameState = {
            a: { score: 0, current: 0, startTime: 0 },
            b: { score: 0, current: 0, startTime: 0 }
        };

        function startGame(group) {
            gameState[group].score = 0;
            gameState[group].current = 0;
            gameState[group].startTime = Date.now(); // 记录开始时间
            
            document.getElementById(`content-${group}`).classList.remove('hidden');
            document.getElementById(`result-${group}`).style.display = 'none';
            document.getElementById(`score-text-${group}`).innerText = "得分: 0";
            
            generateQuestion(group);
        }

        function generateQuestion(group) {
            if (gameState[group].current >= 10) {
                showResult(group);
                return;
            }

            gameState[group].current++;
            document.getElementById(`progress-${group}`).innerText = gameState[group].current;

            const correctValue = Math.floor(Math.random() * 100) + 1;
            
            // 渲染百格图
            const grid = document.getElementById(`grid-${group}`);
            grid.innerHTML = '';
            for (let i = 0; i < 100; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell' + (i < correctValue ? ' filled' : '');
                grid.appendChild(cell);
            }

            // 生成选项
            const optionsContainer = document.getElementById(`options-${group}`);
            optionsContainer.innerHTML = '';
            let options = [correctValue];
            while (options.length < 4) {
                let fake = Math.floor(Math.random() * 100) + 1;
                if (!options.includes(fake)) options.push(fake);
            }
            options.sort(() => Math.random() - 0.5);

            options.forEach(val => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = val + '%';
                btn.onclick = () => handleAnswer(group, val, correctValue);
                optionsContainer.appendChild(btn);
            });
        }

        function handleAnswer(group, selected, correct) {
            if (selected === correct) {
                gameState[group].score++;
                document.getElementById(`score-text-${group}`).innerText = "得分: " + gameState[group].score;
            }
            
            // 简单的闪烁反馈
            const section = document.getElementById(`game-${group}`);
            section.style.opacity = '0.5';
            setTimeout(() => {
                section.style.opacity = '1';
                generateQuestion(group);
            }, 150);
        }

        function showResult(group) {
            const endTime = Date.now();
            const totalSeconds = Math.floor((endTime - gameState[group].startTime) / 1000);
            
            document.getElementById(`content-${group}`).classList.add('hidden');
            const resultScreen = document.getElementById(`result-${group}`);
            resultScreen.style.display = 'flex';
            
            document.getElementById(`final-score-${group}`).innerText = gameState[group].score;
            document.getElementById(`final-time-${group}`).innerText = totalSeconds;
        }

        // 页面加载自动开始
        window.onload = () => {
            startGame('a');
            startGame('b');
        };
    </script>
</body>
</html>
